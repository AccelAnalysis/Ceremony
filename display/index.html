<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ceremony Display">
<title>Ceremony · Audience Display</title>
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/display.css">
</head>
<body class="audience-display">
<main id="displayApp">
 <div id="stage" aria-live="polite"></div>

 <div id="brandBug" class="presentation-layer" aria-label="AK9I · A Brawner Group Company">
  <b>AK9I</b><span>A Brawner Group Company</span>
 </div>

 <div id="clockHud" class="hud presentation-layer hidden" aria-live="off">
  <div class="hud-label">Event Clock</div><div class="hud-value" id="clockValue">--:--:--</div>
 </div>
 <div id="countdownHud" class="hud presentation-layer hidden" aria-live="off">
  <div class="hud-label" id="countdownLabel">Ceremony Begins In</div><div class="hud-value" id="countdownValue">00:00:00</div>
 </div>

 <section id="specialOverlay" class="special presentation-layer hidden" aria-live="polite">
  <div class="special-card" id="specialCard"></div>
 </section>

 <div id="progress" class="presentation-layer"><span></span></div>

 <button id="displaySetup" class="display-setup operator-chrome" type="button" aria-label="Show display controls" aria-expanded="false">Display</button>
 <div id="displayPanel" class="display-panel operator-chrome hidden" role="dialog" aria-label="Audience Display controls">
  <div class="display-panel-head">
   <div><div class="kicker">Audience Display</div><div id="displayStatus" class="muted"></div></div>
   <button class="display-panel-close" id="closeDisplayPanel" type="button" aria-label="Hide display controls">×</button>
  </div>
  <button class="btn primary" id="armAudio">Arm event audio</button>
  <button class="btn" id="keepAwakeBtn">Keep Display Awake</button>
  <button class="btn" id="creditsBtn">Photo Credits</button>
  <button class="btn" id="fullscreenBtn">Fullscreen</button>
  <button class="btn" id="signOutBtn">Sign out</button>
  <div class="display-panel-hint">Move the pointer to this corner, tap the hidden corner control, or press D to reveal these controls.</div>
 </div>

 <section id="creditsOverlay" class="special operator-overlay hidden" aria-live="polite">
  <div class="special-card credits-card" id="creditsCard">
   <div class="kicker">Photo & Media Credits</div>
   <div id="creditsList" class="credits-list"></div>
   <button class="btn" id="closeCredits">Close</button>
  </div>
 </section>

 <audio id="audioA" preload="auto"></audio>
 <audio id="audioB" preload="auto"></audio>
</main>
<script type="module" src="../src/display.js"></script>
</body>
</html>
