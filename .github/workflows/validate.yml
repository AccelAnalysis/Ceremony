name: Validate Ceremony

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          set -e
          for file in src/*.js tests/*.mjs; do
            node --check "$file"
          done
      - name: Ceremony smoke tests
        run: node tests/smoke.mjs
