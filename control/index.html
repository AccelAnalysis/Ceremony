<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ceremony · Event Director</title><link rel="stylesheet" href="../styles/base.css"><link rel="stylesheet" href="../styles/control.css"></head><body class="app-shell"><header class="topbar"><div class="brand-lockup"><strong>CEREMONY</strong><span>Event Director</span></div><span id="eventName" class="status-chip">Loading…</span><span id="liveClock" class="status-chip"></span><div class="spacer"></div><a class="btn" id="displayLink" target="_blank">Audience Display</a><button class="btn" id="fullscreenBtn">Fullscreen</button><button class="btn" id="signOutBtn">Sign out</button></header><main class="director-wrap"><section class="director-hero panel"><div><div class="kicker">Authoritative event state</div><h1 id="modeTitle">Pre-Show Loop</h1><p id="currentSlide">Waiting for state…</p></div><div class="state-version">STATE <b id="stateVersion">—</b></div></section><section class="mode-grid" id="modeGrid"></section><section class="control-grid"><div class="panel"><h2 class="section-title">Deck</h2><div class="director-buttons"><button class="btn" data-action="slide:prev">◀ Previous</button><button class="btn primary" data-action="deck:play">Play</button><button class="btn" data-action="deck:pause">Pause</button><button class="btn" data-action="slide:next">Next ▶</button></div><div class="toolbar" style="margin-top:12px"><button class="btn" data-action="deck:restart">Restart</button><button class="btn" id="clockToggle">Clock</button><button class="btn" id="countdownToggle">Countdown</button></div></div><div class="panel"><h2 class="section-title">Quick Message</h2><div class="field"><input id="messageInput" value="Please Take Your Seats"></div><div class="toolbar" style="margin-top:10px"><button class="btn primary" id="showMessage">Show</button><button class="btn" data-action="message:hide">Clear</button></div></div><div class="panel"><h2 class="section-title">Graduate Recognition</h2><div class="field"><select id="graduateSelect"></select></div><div class="toolbar" style="margin-top:10px"><button class="btn primary" id="showGraduate">Show Graduate</button><button class="btn" id="nextGraduate">Next</button><button class="btn" data-action="graduate:hide">Hide</button></div></div><div class="panel"><h2 class="section-title">Award Reveal</h2><div class="field"><select id="awardSelect"></select></div><div class="toolbar" style="margin-top:10px"><button class="btn" id="stageAward">Stage</button><button class="btn primary" id="revealAward">Reveal</button><button class="btn" data-action="award:hide">Hide</button></div></div><div class="panel span2"><h2 class="section-title">Music</h2><div class="music-grid"><select id="trackSelect"></select><button class="btn primary" id="playTrack">Play track</button><button class="btn" data-action="music:pause">Pause</button><button class="btn" data-action="music:fade">Fade out</button><label>Volume <input id="volume" type="range" min="0" max="100" value="35"></label><button class="btn" id="muteBtn">Mute</button></div></div><div class="panel span2"><h2 class="section-title">Schedule</h2><div id="scheduleStatus" class="notice">Loading schedule…</div><div class="toolbar" style="margin-top:10px"><button class="btn danger" id="emergencyHold">Emergency Hold</button><button class="btn" id="wakeBtn">Keep Director Awake</button></div></div></section></main><script type="module" src="../src/director.js"></script></body></html>
